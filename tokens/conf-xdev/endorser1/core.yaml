logging:
  spec: info
  format: "%{color}%{time:15:04:05.000} [%{module}] %{shortfunc} %{level:.4s}%{color:reset} %{message}"

fsc:
  id: endorser1 # CORE_FSC_ID
  identity:
    cert:
      file: ./keys/node.crt
    key:
      file: ./keys/node.key
  p2p:
    listenAddress: /ip4/0.0.0.0/tcp/9301 # CORE_P2P_LISTENADDRESS
    type: websocket
    opts:
      routing:
        path: ./routing-config.yaml
  persistences:
    default:
      type: sqlite
      opts:
        dataSource: file:./data/fts.sqlite # CORE_FSC_PERSISTENCES_OPTS_DATASOURCE
  endpoint:
    resolvers:
      - name: issuer
        identity:
          id: issuer
          path: ./keys/nodes/issuer.crt
        addresses:
          P2P: issuer.example.com:9101
      - name: endorser1
        identity:
          id: endorser1
          path: ./keys/nodes/endorser1.crt
        addresses:
          P2P: endorser1.example.com:9301
      - name: endorser2
        identity:
          id: endorser2
          path: ./keys/nodes/endorser2.crt
        addresses:
          P2P: endorser2.example.com:9401
      - name: owner1
        identity:
          id: owner1
          path: ./keys/nodes/owner1.crt
        addresses:
          P2P: owner1.example.com:9501
      - name: owner2
        identity:
          id: owner2
          path: ./keys/nodes/owner2.crt
        addresses:
          P2P: owner2.example.com:9601

fabric:
  enabled: true
  default:
    driver: fabricx
    msps:
      - id: endorser
        mspType: bccsp
        mspID: Org1MSP
        path: ./keys/fabric/endorser
    # Client TLS for every connection on this network. devnet's committer-sidecar and
    # committer-query-service require mTLS; the peers, notificationService and queryService
    # endpoints below inherit this block field by field (FSC v0.22+), so it is set once here.
    tls:
      enabled: true
      clientAuthEnabled: true
      clientCert:
        file: ./keys/fabric/tls-client/server.crt
      clientKey:
        file: ./keys/fabric/tls-client/server.key
      rootCAs:
        files:
          - ./keys/fabric/org-tls-ca.pem
    peers:
      - address: committer-sidecar:4001
        usage:
    notificationService:
      endpoints:
        - address: committer-sidecar:4001
    queryService:
      endpoints:
        - address: committer-query-service:7001
    channels:
      - name: mychannel
        default: true

token:
  enabled: true
  tms:
    mytms:
      network: default
      channel: mychannel
      namespace: token_namespace
      driver: zkatdlog
      services:
        network:
          fabric:
            fsc_endorsement:
              endorser: true
              id: endorser
              policy:
                type: all
              endorsers:
                - endorser1
                # - endorser2

                # The endorser has the public parameters so it can commit them to the ledger.
      publicParameters:
        path: ../namespace/zkatdlognoghv1_pp.json
