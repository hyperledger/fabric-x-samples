# Configuration for running fxevm inside Docker Compose (compose.gateway.yaml).
# Paths are absolute as mounted in the container; hosts are Docker service aliases.
#
# One process runs both of Org1's roles: the gateway (JSON-RPC, ordering) and
# Org1's embedded endorser (EVM execution, signing). The gateway also collects
# Org2's endorsement from its standalone endorser (endorser-org2-conf.yaml).
# All state is kept in SQLite under /data, so it survives restarts.

network:
  protocol: fabric-x
  channel: mychannel
  namespace: basic
  ns-version: "1.0"
  chain-id: 4011

# The committer this process keeps in sync with.
committer:
  endpoint:
    host: committer-sidecar
    port: 4001
  tls:
    mode: mtls
    cert-path: /user-tls/client.crt
    key-path: /user-tls/client.key
    ca-cert-paths:
      - /user-tls/ca.crt

gateway:
  listen: "0.0.0.0:8545"

  # Host headers accepted from non-IP clients (DNS-rebinding guard). Blockscout
  # reaches the gateway as http://gateway:8545 inside the compose network.
  vhosts:
    - localhost
    - gateway

  identity:
    msp-id: Org1MSP
    msp-dir: /user-msp

  database:
    connection-string: "file:/data/gateway.db"

  orderers:
    - endpoint:
        host: orderer-party1-router
        port: 7050
      tls:
        mode: mtls
        cert-path: /user-tls/client.crt
        key-path: /user-tls/client.key
        ca-cert-paths:
          - /crypto/orderer1-tls-ca.pem
    - endpoint:
        host: orderer-party2-router
        port: 7150
      tls:
        mode: mtls
        cert-path: /user-tls/client.crt
        key-path: /user-tls/client.key
        ca-cert-paths:
          - /crypto/orderer2-tls-ca.pem
    - endpoint:
        host: orderer-party3-router
        port: 7250
      tls:
        mode: mtls
        cert-path: /user-tls/client.crt
        key-path: /user-tls/client.key
        ca-cert-paths:
          - /crypto/orderer3-tls-ca.pem
    - endpoint:
        host: orderer-party4-router
        port: 7350
      tls:
        mode: mtls
        cert-path: /user-tls/client.crt
        key-path: /user-tls/client.key
        ca-cert-paths:
          - /crypto/orderer4-tls-ca.pem

  # Other orgs' endorsers, dialed over gRPC in addition to the embedded one.
  # Every transaction needs all of their signatures, so it also depends on
  # each of them being up.
  endorsers:
    - endpoint:
        host: endorser.org2.example.com
        port: 7051
      tls:
        mode: mtls
        cert-path: /user-tls/client.crt
        key-path: /user-tls/client.key
        ca-cert-paths:
          - /crypto/org2-tls-ca.pem

# This org's endorser, embedded in the gateway process.
endorser:
  name: org1
  identity:
    msp-id: Org1MSP
    msp-dir: /endorser-msp
  database:
    database: sqlite
    connection-string: "file:/data/endorser-org1.db"
