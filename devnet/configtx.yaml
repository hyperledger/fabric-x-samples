---
Organizations:
  - &OrdererOrg1MSP
    Name: orderer-org-1
    ID: OrdererOrg1MSP
    MSPDir: ./crypto/ordererOrganizations/orderer-org-1/msp
    Policies:
      Readers:
        Type: Signature
        Rule: OR('OrdererOrg1MSP.member')
      Writers:
        Type: Signature
        Rule: OR('OrdererOrg1MSP.member')
      Admins:
        Type: Signature
        Rule: OR('OrdererOrg1MSP.admin')
    OrdererEndpoints:
      - id=0,broadcast,orderer-party1-router:7050
      - id=0,deliver,orderer-party1-assembler:7053

  - &OrdererOrg2MSP
    Name: orderer-org-2
    ID: OrdererOrg2MSP
    MSPDir: ./crypto/ordererOrganizations/orderer-org-2/msp
    Policies:
      Readers:
        Type: Signature
        Rule: OR('OrdererOrg2MSP.member')
      Writers:
        Type: Signature
        Rule: OR('OrdererOrg2MSP.member')
      Admins:
        Type: Signature
        Rule: OR('OrdererOrg2MSP.admin')
    OrdererEndpoints:
      - id=1,broadcast,orderer-party2-router:7150
      - id=1,deliver,orderer-party2-assembler:7153

  - &OrdererOrg3MSP
    Name: orderer-org-3
    ID: OrdererOrg3MSP
    MSPDir: ./crypto/ordererOrganizations/orderer-org-3/msp
    Policies:
      Readers:
        Type: Signature
        Rule: OR('OrdererOrg3MSP.member')
      Writers:
        Type: Signature
        Rule: OR('OrdererOrg3MSP.member')
      Admins:
        Type: Signature
        Rule: OR('OrdererOrg3MSP.admin')
    OrdererEndpoints:
      - id=2,broadcast,orderer-party3-router:7250
      - id=2,deliver,orderer-party3-assembler:7253

  - &OrdererOrg4MSP
    Name: orderer-org-4
    ID: OrdererOrg4MSP
    MSPDir: ./crypto/ordererOrganizations/orderer-org-4/msp
    Policies:
      Readers:
        Type: Signature
        Rule: OR('OrdererOrg4MSP.member')
      Writers:
        Type: Signature
        Rule: OR('OrdererOrg4MSP.member')
      Admins:
        Type: Signature
        Rule: OR('OrdererOrg4MSP.admin')
    OrdererEndpoints:
      - id=3,broadcast,orderer-party4-router:7350
      - id=3,deliver,orderer-party4-assembler:7353

  - &Org1MSP
    Name: Org1
    ID: Org1MSP
    MSPDir: ./crypto/peerOrganizations/org1.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: OR('Org1MSP.member')
      Writers:
        Type: Signature
        Rule: OR('Org1MSP.member')
      Endorsement:
        Type: Signature
        Rule: OR('Org1MSP.member')
      Admins:
        Type: Signature
        Rule: OR('Org1MSP.admin')

  - &Org2MSP
    Name: Org2
    ID: Org2MSP
    MSPDir: ./crypto/peerOrganizations/org2.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: OR('Org2MSP.member')
      Writers:
        Type: Signature
        Rule: OR('Org2MSP.member')
      Endorsement:
        Type: Signature
        Rule: OR('Org2MSP.member')
      Admins:
        Type: Signature
        Rule: OR('Org2MSP.admin')

Application: &ApplicationDefaults
  Organizations:
    - *Org1MSP
    - *Org2MSP
  Policies:
    # who can read blocks from the orderer (part of /Channel/Readers). The committer doesn't check
    # this: it accepts any client with a cert from an application org's TLS CA.
    Readers:
      Type: ImplicitMeta
      Rule: ANY Readers
    # who can submit transactions (part of /Channel/Writers). The orderer enforces it because the
    # router and batcher configs set ClientSignatureVerificationRequired.
    Writers:
      Type: ImplicitMeta
      Rule: ANY Writers
    # who can change the application config.
    Admins:
      Type: ImplicitMeta
      Rule: ANY Admins
    # not read by the committer or orderer: each namespace has its own endorsement policy (set at
    # creation). The per-org Endorsement policies are used though, by the *Endorsement rules below.
    Endorsement:
      Type: ImplicitMeta
      Rule: ANY Endorsement
    # authorize transactions on the _meta system namespace (create or update a namespace).
    LifecycleEndorsement:
      Type: Signature
      Rule: OR('Org1MSP.member','Org2MSP.member')
    # authorize transactions on the _snapshot and _checkpoint system namespaces.
    SnapshotEndorsement:
      Type: ImplicitMeta
      Rule: MAJORITY Endorsement
    CheckpointEndorsement:
      Type: ImplicitMeta
      Rule: MAJORITY Endorsement

Orderer: &OrdererDefaults
  OrdererType: arma
  # Batching is configured in shared_config.yaml. Of the batch settings here only AbsoluteMaxBytes is
  # read, and it must equal Batching.BatchSize.AbsoluteMaxBytes there (the orderer rejects the
  # genesis block otherwise). configtxgen fills in defaults for the others.
  BatchSize:
    AbsoluteMaxBytes: 10 MB
  ConsenterMapping:
    - ID: 1
      Host: orderer-party1-consenter
      Port: 7052
      MSPID: OrdererOrg1MSP
      Identity: ./crypto/ordererOrganizations/orderer-org-1/orderers/party1/consenter.orderer-org-1/msp/signcerts/consenter.orderer-org-1-cert.pem
      ClientTLSCert: ./crypto/ordererOrganizations/orderer-org-1/orderers/party1/consenter.orderer-org-1/tls/server.crt
      ServerTLSCert: ./crypto/ordererOrganizations/orderer-org-1/orderers/party1/consenter.orderer-org-1/tls/server.crt
    - ID: 2
      Host: orderer-party2-consenter
      Port: 7152
      MSPID: OrdererOrg2MSP
      Identity: ./crypto/ordererOrganizations/orderer-org-2/orderers/party2/consenter.orderer-org-2/msp/signcerts/consenter.orderer-org-2-cert.pem
      ClientTLSCert: ./crypto/ordererOrganizations/orderer-org-2/orderers/party2/consenter.orderer-org-2/tls/server.crt
      ServerTLSCert: ./crypto/ordererOrganizations/orderer-org-2/orderers/party2/consenter.orderer-org-2/tls/server.crt
    - ID: 3
      Host: orderer-party3-consenter
      Port: 7252
      MSPID: OrdererOrg3MSP
      Identity: ./crypto/ordererOrganizations/orderer-org-3/orderers/party3/consenter.orderer-org-3/msp/signcerts/consenter.orderer-org-3-cert.pem
      ClientTLSCert: ./crypto/ordererOrganizations/orderer-org-3/orderers/party3/consenter.orderer-org-3/tls/server.crt
      ServerTLSCert: ./crypto/ordererOrganizations/orderer-org-3/orderers/party3/consenter.orderer-org-3/tls/server.crt
    - ID: 4
      Host: orderer-party4-consenter
      Port: 7352
      MSPID: OrdererOrg4MSP
      Identity: ./crypto/ordererOrganizations/orderer-org-4/orderers/party4/consenter.orderer-org-4/msp/signcerts/consenter.orderer-org-4-cert.pem
      ClientTLSCert: ./crypto/ordererOrganizations/orderer-org-4/orderers/party4/consenter.orderer-org-4/tls/server.crt
      ServerTLSCert: ./crypto/ordererOrganizations/orderer-org-4/orderers/party4/consenter.orderer-org-4/tls/server.crt
  Organizations:
    - *OrdererOrg1MSP
    - *OrdererOrg2MSP
    - *OrdererOrg3MSP
    - *OrdererOrg4MSP
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: ANY Readers
    Writers:
      Type: ImplicitMeta
      Rule: ANY Writers
    Admins:
      Type: ImplicitMeta
      Rule: MAJORITY Admins
    BlockValidation:
      Type: ImplicitMeta
      Rule: ANY Writers

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: ANY Readers
    Writers:
      Type: ImplicitMeta
      Rule: ANY Writers
    Admins:
      Type: ImplicitMeta
      Rule: MAJORITY Admins

Profiles:
  OrgsChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Arma:
        Path: ./crypto/shared_config.binpb
    Consortium: SampleConsortium
    Application:
      <<: *ApplicationDefaults
