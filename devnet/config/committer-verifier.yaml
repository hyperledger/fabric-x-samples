---
server:
  endpoint: :5001
  tls:
    mode: mtls
    cert-path: /node-tls/server.crt
    key-path: /node-tls/server.key
    ca-cert-paths:
      - /org-tls-ca.pem
monitoring:
  endpoint: :2115
  tls:
    mode: none

# more parallelism and a much shorter batch cutoff than the defaults (4 and 500ms), for low latency
parallelism: 40
batch-time-cutoff: 1ms

logging:
  logSpec: info:grpc=error
