PartyID: 1

General:
  ListenAddress: 0.0.0.0
  ListenPort: 7050
  TLS:
    Enabled: true
    PrivateKey: /node-tls/server.key
    Certificate: /node-tls/server.crt
    # clients are trusted via the application orgs' TLS CAs in the genesis block (more: ClientRootCAs)
    ClientAuthRequired: true
  Bootstrap:
    Method: block
    File: /bootstrap/genesis.block
  LocalMSPDir: /node-msp
  LocalMSPID: OrdererOrg1MSP

  # Validate client signatures against /Channel/Writers.
  # Disabled on devnet because we enforce mTLS and endorsement. Enable for defence in depth.
  ClientSignatureVerificationRequired: false

FileStore:
  Location: /data

Operations:
  ListenAddress: 0.0.0.0
  ListenPort: 9443
  TLS:
    Enabled: false

Router:
  NumberOfStreamsPerConnection: 20
