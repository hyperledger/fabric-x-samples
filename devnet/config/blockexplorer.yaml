# Configuration for the fabric-x block explorer (https://github.com/LF-Decentralized-Trust-labs/fabric-x-block-explorer)
# The explorer container reads it via EXPLORER_CONFIG_PATH, set in compose.block-explorer.yaml.

database:
  endpoints:
    - host: explorer-db
      port: 5432
  user: postgres
  password: postgres
  dbname: explorer

sidecar:
  connection:
    endpoint:
      host: committer-sidecar
      port: 4001
    tls:
      mode: mtls
      ca-cert-paths:
        - /user-tls/ca.crt
      cert-path: /user-tls/client.crt
      key-path: /user-tls/client.key
  start_block: 0

server:
  rest:
    endpoint:
      host: 0.0.0.0
      port: 8080
