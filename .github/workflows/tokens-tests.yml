name: Token Sample Tests

on:
  push:
    branches: [ "main" ]
    paths: [ "tokens/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "tokens/**" ]
  workflow_dispatch:


jobs:
  test:
    name: Token Samples Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: "fabricx"
          - platform: "fabric3"
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tokens/go.mod
          cache-dependency-path: tokens/go.sum

      - name: Verify Go installation
        run: |
          go version
          echo "GOPATH: $GOPATH"
          echo "GOROOT: $GOROOT"

      - name: Set up Python
        if: ${{ matrix.platform == 'fabricx' }}
        uses: actions/setup-python@v4
        with:
          # ansible-core supports controller Python 3.12-3.14; "3.x" now resolves to 3.15,
          # which ansible-core 2.21 crashes on at import time.
          python-version: "3.13"

      - name: Install Ansible
        if: ${{ matrix.platform == 'fabricx' }}
        run: |
          python -m pip install --upgrade pip
          # Pinned to the versions the fabricx flow is verified against; unpinned, a new
          # release can break CI on its own (as ansible-core 2.21's stricter templating did).
          pip install ansible==14.5.0 ansible-core==2.21.5
          ansible --version

      - name: Run samples tests on ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        working-directory: tokens
        run: make install-prerequisites test
