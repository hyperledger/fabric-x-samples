# Used by the fxconfig-init container to create the namespace. It shares the
# committer's network namespace, so all services are reachable on localhost.
logging:
  level: info

msp:
  localMspID: peer-org-0
  configPath: /testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/msp

orderer:
  address: localhost:7050
  channel: mychannel
  tls:
    enabled: true
    clientCert: /testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.crt
    clientKey: /testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.key
    rootCerts:
      # The orderer's server cert is signed by the orderer org's TLS CA.
      - /testdata/crypto/ordererOrganizations/orderer-org-0.com/msp/tlscacerts/tlsorderer-org-0-CA-cert.pem

queries:
  address: localhost:7001
  tls:
    enabled: true
    clientCert: /testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.crt
    clientKey: /testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.key
    rootCerts:
      - /testdata/crypto/peerOrganizations/peer-org-0.com/msp/tlscacerts/tlspeer-org-0-CA-cert.pem

notifications:
  address: localhost:4001
  tls:
    enabled: true
    clientCert: /testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.crt
    clientKey: /testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.key
    rootCerts:
      - /testdata/crypto/peerOrganizations/peer-org-0.com/msp/tlscacerts/tlspeer-org-0-CA-cert.pem
  connectionTimeout: 10s
  waitingTimeout: 30s
