# Channel and namespace must match the endorser and committer configuration.
channel-id: mychannel
namespace: mynamespace

# Protocol must match the endorser and ordering service.
protocol: fabric-x

# MSP identity used to sign the proposal and the transaction envelope.
identity:
  msp-id: peer-org-0
  msp-dir: testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/msp

# One entry per endorser organization.
# Each endorser presents a server cert from its own org, so the CA differs per entry.
endorsers:
  - endpoint:
      host: localhost
      port: 9001
    tls:
      mode: mtls
      cert-path: testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.crt
      key-path: testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.key
      ca-cert-paths:
        - testdata/crypto/peerOrganizations/peer-org-0.com/tlsca/tlspeer-org-0-CA-cert.pem
  - endpoint:
      host: localhost
      port: 9002
    tls:
      mode: mtls
      cert-path: testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.crt
      key-path: testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.key
      ca-cert-paths:
        - testdata/crypto/peerOrganizations/peer-org-1.com/tlsca/tlspeer-org-1-CA-cert.pem

# Ordering service endpoint.
orderer:
  endpoint:
    host: localhost
    port: 7050
  tls:
    mode: mtls
    cert-path: testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.crt
    key-path: testdata/crypto/peerOrganizations/peer-org-0.com/users/client@peer-org-0.com/tls/client.key
    ca-cert-paths:
      - testdata/crypto/ordererOrganizations/orderer-org-0.com/msp/tlscacerts/tlsorderer-org-0-CA-cert.pem
